<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الماسة الذهبية للعطور والبخور</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Tahoma", "Segoe UI", sans-serif;
    background: radial-gradient(ellipse at top, #1a1a2e 0%, #05050a 70%);
    min-height: 100vh;
    padding: 0 15px 40px;
    color: #f5f5f5;
    overflow-x: hidden;
    position: relative;
  }

  /* ===== خلفية جسيمات ذهبية متطايرة ===== */
  .sparkle-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .sparkle {
    position: absolute;
    bottom: -20px;
    width: 6px;
    height: 6px;
    background: radial-gradient(circle, #ffe9a8 0%, #d4af37 60%, transparent 100%);
    border-radius: 50%;
    opacity: 0;
    animation: floatUp linear infinite;
    box-shadow: 0 0 8px 2px rgba(212,175,55,0.6);
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) translateX(0) scale(0.5); opacity: 0; }
    10%  { opacity: 1; }
    50%  { transform: translateY(-50vh) translateX(20px) scale(1); }
    90%  { opacity: 0.6; }
    100% { transform: translateY(-105vh) translateX(-10px) scale(0.3); opacity: 0; }
  }

  /* ===== رأس الصفحة: الشعار + الدخان ===== */
  header {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 35px 10px 10px;
  }

  .logo-wrap {
    position: relative;
    display: inline-block;
    width: 190px;
    height: 190px;
  }

  .logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 0 25px rgba(212,175,55,0.55));
    animation: glowPulse 3.5s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0%, 100% { filter: drop-shadow(0 0 15px rgba(212,175,55,0.4)); }
    50%      { filter: drop-shadow(0 0 35px rgba(255,217,128,0.75)); }
  }

  /* دخان بخور متصاعد فوق الشعار */
  .incense {
    position: absolute;
    bottom: 78%;
    left: 50%;
    width: 100px;
    height: 130px;
    pointer-events: none;
  }
  .smoke {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 10px;
    height: 10px;
    background: rgba(230,230,230,0.55);
    border-radius: 50%;
    filter: blur(4px);
    animation: smokeRise 4s ease-in infinite;
  }
  .smoke:nth-child(1) { animation-delay: 0s;   left: 46%; }
  .smoke:nth-child(2) { animation-delay: 1.1s; left: 52%; }
  .smoke:nth-child(3) { animation-delay: 2.2s; left: 48%; }
  .smoke:nth-child(4) { animation-delay: 3.1s; left: 54%; }

  @keyframes smokeRise {
    0%   { transform: translate(-50%, 0) scale(0.4) rotate(0deg); opacity: 0; }
    15%  { opacity: 0.6; }
    50%  { transform: translate(-50%, -60px) scale(1.3) rotate(15deg); opacity: 0.4; }
    100% { transform: translate(-50%, -130px) scale(2.2) rotate(-10deg); opacity: 0; }
  }

  .brand-name {
    margin-top: 10px;
    font-size: 30px;
    font-weight: bold;
    background: linear-gradient(90deg, #b8860b, #ffe08a, #b8860b);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 4s linear infinite;
  }
  @keyframes shine {
    to { background-position: 200% center; }
  }

  .brand-sub {
    margin-top: 4px;
    font-size: 14px;
    color: #d4af37;
    letter-spacing: 1px;
    opacity: 0.9;
  }

  /* ===== حاوية الصفحة ===== */
  .container {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 25px auto 0;
    background: rgba(20, 20, 30, 0.75);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(212,175,55,0.35);
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(212,175,55,0.08);
    overflow: hidden;
  }

  .search-box {
    padding: 24px 20px;
    background: linear-gradient(180deg, rgba(212,175,55,0.08), transparent);
    border-bottom: 1px solid rgba(212,175,55,0.25);
  }

  .search-box input {
    width: 100%;
    padding: 15px 20px;
    font-size: 16px;
    background: rgba(255,255,255,0.06);
    border: 2px solid rgba(212,175,55,0.4);
    border-radius: 12px;
    outline: none;
    color: #fff;
    transition: border-color .25s, box-shadow .25s;
  }
  .search-box input::placeholder { color: #a8a8b3; }
  .search-box input:focus {
    border-color: #d4af37;
    box-shadow: 0 0 15px rgba(212,175,55,0.35);
  }

  .count {
    margin-top: 10px;
    font-size: 13px;
    color: #c9b37c;
  }

  .table-wrap {
    max-height: 60vh;
    overflow-y: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead th {
    position: sticky;
    top: 0;
    background: linear-gradient(180deg, #2a2a3d, #1c1c2b);
    color: #f0d98c;
    padding: 13px 10px;
    font-size: 14px;
    text-align: center;
    border-bottom: 2px solid rgba(212,175,55,0.4);
    z-index: 2;
  }
  tbody td {
    padding: 12px 10px;
    text-align: center;
    font-size: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    color: #eee;
  }
  tbody tr { transition: background .2s; }
  tbody tr:nth-child(even) { background: rgba(255,255,255,0.03); }
  tbody tr:hover { background: rgba(212,175,55,0.12); }

  .name-cell { font-weight: bold; color: #f0c869; }
  mark {
    background: #d4af37;
    color: #1a1a1a;
    border-radius: 3px;
    padding: 0 3px;
  }

  .no-results {
    text-align: center;
    padding: 30px;
    color: #8a8a9a;
    display: none;
  }

  /* صفوف نتائج البحث قابلة للاختيار */
  tbody tr.result-row { cursor: pointer; }
  tbody tr.result-row.selected {
    background: rgba(212,175,55,0.22) !important;
    box-shadow: inset 0 0 0 1px rgba(212,175,55,0.6);
  }

  /* ===== لوحة اختيار الكمية ===== */
  .qty-panel {
    display: none;
    padding: 18px 20px;
    background: rgba(212,175,55,0.08);
    border-top: 1px solid rgba(212,175,55,0.3);
    border-bottom: 1px solid rgba(212,175,55,0.3);
  }
  .qty-panel.active { display: block; }
  .qty-panel .selected-name {
    font-size: 15px;
    margin-bottom: 12px;
    color: #f0d98c;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .qty-panel .selected-name b { color: #fff; }

  .cancel-select-btn {
    border: 1px solid rgba(220,80,80,0.5);
    background: rgba(220,80,80,0.15);
    color: #ff9a9a;
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s;
  }
  .cancel-select-btn:hover { background: rgba(220,80,80,0.3); }

  .qty-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: stretch;
  }
  .qty-row input[type="number"] {
    flex: 1 1 140px;
    min-width: 100px;
    padding: 12px 14px;
    font-size: 16px;
    background: rgba(255,255,255,0.06);
    border: 2px solid rgba(212,175,55,0.4);
    border-radius: 10px;
    color: #fff;
    outline: none;
  }
  .qty-row select {
    flex: 0 0 110px;
    padding: 12px 10px;
    font-size: 15px;
    background: rgba(255,255,255,0.06);
    border: 2px solid rgba(212,175,55,0.4);
    border-radius: 10px;
    color: #fff;
    outline: none;
  }
  .qty-row select { display: none; }
  .qty-row input[type="text"].notes-input {
    flex: 1 1 220px;
    min-width: 140px;
    padding: 12px 14px;
    font-size: 15px;
    background: rgba(255,255,255,0.06);
    border: 2px solid rgba(212,175,55,0.4);
    border-radius: 10px;
    color: #fff;
    outline: none;
  }
  .qty-row input[type="text"].notes-input::placeholder { color: #a8a8b3; }
  .qty-row .unit-label {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    padding: 0 16px;
    font-size: 15px;
    font-weight: bold;
    background: rgba(212,175,55,0.15);
    border: 2px solid rgba(212,175,55,0.4);
    border-radius: 10px;
    color: #f0d98c;
  }
  .qty-row select option { background: #1c1c2b; color: #fff; }

  .add-btn {
    flex: 0 0 auto;
    padding: 12px 22px;
    font-size: 15px;
    font-weight: bold;
    background: linear-gradient(135deg, #d4af37, #b8860b);
    color: #1a1a1a;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    white-space: nowrap;
  }
  .add-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(212,175,55,0.4);
  }
  .add-btn:active { transform: translateY(0); }

  /* ===== جدول الأصناف المضافة ===== */
  .cart-wrap {
    display: none;
  }
  .cart-wrap.active { display: block; }

  .cart-section {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 25px auto 0;
    background: rgba(20, 20, 30, 0.75);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(212,175,55,0.35);
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(212,175,55,0.08);
    overflow: hidden;
  }

  .cart-header {
    padding: 16px 20px;
    background: linear-gradient(180deg, rgba(212,175,55,0.15), transparent);
    border-bottom: 1px solid rgba(212,175,55,0.25);
    font-size: 16px;
    font-weight: bold;
    color: #f0d98c;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .cart-header span.badge {
    background: #d4af37;
    color: #1a1a1a;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 20px;
  }

  .cart-table-wrap { max-height: 45vh; overflow-y: auto; }

  .notes-edit {
    width: 100%;
    min-width: 100px;
    padding: 7px 10px;
    font-size: 13px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(212,175,55,0.35);
    border-radius: 8px;
    color: #eee;
    outline: none;
    text-align: center;
  }
  .notes-edit::placeholder { color: #8a8a9a; }
  .notes-edit:focus {
    border-color: #d4af37;
    box-shadow: 0 0 8px rgba(212,175,55,0.3);
  }

  .remove-btn {
    background: rgba(220,50,50,0.2);
    color: #ff8a8a;
    border: 1px solid rgba(220,50,50,0.5);
    border-radius: 8px;
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: background .15s;
  }
  .remove-btn:hover { background: rgba(220,50,50,0.4); }

  .pdf-btn-wrap {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 18px auto 0;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .filename-wrap {
    width: 100%;
    max-width: 360px;
  }
  .filename-wrap label {
    display: block;
    font-size: 13px;
    color: #c9b37c;
    margin-bottom: 6px;
    text-align: center;
  }
  .filename-wrap input {
    width: 100%;
    padding: 11px 14px;
    font-size: 14px;
    background: rgba(255,255,255,0.06);
    border: 2px solid rgba(212,175,55,0.4);
    border-radius: 10px;
    outline: none;
    color: #fff;
    text-align: center;
    transition: border-color .25s, box-shadow .25s;
  }
  .filename-wrap input::placeholder { color: #a8a8b3; }
  .filename-wrap input:focus {
    border-color: #d4af37;
    box-shadow: 0 0 15px rgba(212,175,55,0.35);
  }
  .pdf-btn {
    padding: 13px 28px;
    font-size: 15px;
    font-weight: bold;
    background: linear-gradient(135deg, #d4af37, #8b6508);
    color: #fff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
  }
  .pdf-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(212,175,55,0.45);
  }
  .pdf-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }


  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    margin-top: 20px;
    font-size: 12px;
    color: #7a7a88;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.min.js"></script>

const tableBody = document.getElementById('tableBody');
const searchInput = document.getElementById('searchInput');
const resultCount = document.getElementById('resultCount');
const noResults = document.getElementById('noResults');

const qtyPanel = document.getElementById('qtyPanel');
const selectedItemName = document.getElementById('selectedItemName');
const qtyInput = document.getElementById('qtyInput');
const notesInput = document.getElementById('notesInput');
const addBtn = document.getElementById('addBtn');

const cartSection = document.getElementById('cartSection');
const cartWrap = document.getElementById('cartWrap');
const cartBody = document.getElementById('cartBody');
const cartCount = document.getElementById('cartCount');

let selectedItem = null;
let cart = [];

function highlight(text, term) {
  if (!term) return text;
  const escaped = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const regex = new RegExp(`(${escaped})`, 'gi');
  return text.replace(regex, '<mark>$1</mark>');
}

// الأكواد اللي تبدأ بـ CP تبقى "كريشين"، وأي كود تاني (رقمي) يبقى "اكسبريشن"
function code2Label(code2) {
  if (!code2) return '';
  return code2.toUpperCase().startsWith('CP') ? 'CP' : 'EXP';
}

function code2Display(code2) {
  if (!code2) return '-';
  return `${code2} <small style="opacity:.65">(${code2Label(code2)})</small>`;
}

function render(filter = '') {
  tableBody.innerHTML = '';
  const term = filter.trim().toLowerCase();
  let visibleCount = 0;

  if (term) {
    data.forEach(item => {
      const matches =
        item.name.toLowerCase().includes(term) ||
        item.code1.toLowerCase().includes(term) ||
        item.code2.toLowerCase().includes(term);

      if (matches) {
        visibleCount++;
        const tr = document.createElement('tr');
        tr.className = 'result-row';
        tr.dataset.m = item.m;
        tr.innerHTML = `
          <td>${item.m}</td>
          <td class="name-cell">${highlight(item.name, term)}</td>
          <td>${highlight(item.code1, term)}</td>
          <td>${item.code2 ? highlight(item.code2, term) + ` <small style="opacity:.65">(${code2Label(item.code2)})</small>` : '-'}</td>
        `;
        tr.addEventListener('click', () => selectItem(item, tr));
        tableBody.appendChild(tr);
      }
    });
  }

  resultCount.textContent = term
    ? `عدد النتائج: ${visibleCount}`
    : `اكتب في مربع البحث لعرض الأصناف`;

  noResults.style.display = (term && visibleCount === 0) ? 'block' : 'none';
}

function selectItem(item, rowEl) {
  // إخفاء كل الأصناف الأخرى وترك الصنف المختار بس ظاهر
  document.querySelectorAll('#tableBody tr.result-row').forEach(r => {
    if (r === rowEl) {
      r.classList.add('selected');
      r.style.display = '';
    } else {
      r.classList.remove('selected');
      r.style.display = 'none';
    }
  });
  selectedItem = item;
  selectedItemName.textContent = `${item.name} (TCF: ${item.code1 || '-'}${item.code2 ? ' /  ' + code2Label(item.code2) + ': ' + item.code2 : ''})`;
  qtyPanel.classList.add('active');
  qtyInput.value = '';
  qtyInput.focus();
}

// بيرجّع كل نتائج البحث تظهر تاني بعد الإلغاء أو الإضافة
function showAllResultRows() {
  document.querySelectorAll('#tableBody tr.result-row').forEach(r => {
    r.classList.remove('selected');
    r.style.display = '';
  });
}

document.getElementById('cancelSelectBtn').addEventListener('click', () => {
  qtyPanel.classList.remove('active');
  selectedItem = null;
  showAllResultRows();
});

function formatQty(kg) {
  // لو الكمية عدد صحيح (زي 20) بتتعرض من غير كسور: "20"
  // لو فيها كسور (زي 0.360) بتتعرض بأقصى دقة 3 أرقام عشرية زي ما هي: "0.360"
  const rounded = Math.round(kg * 1000) / 1000;
  if (Number.isInteger(rounded)) return rounded.toString();
  return rounded.toFixed(3);
}

function renderCart() {
  cartBody.innerHTML = '';
  cart.forEach((row, idx) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${idx + 1}</td>
      <td class="name-cell">${row.name}</td>
      <td>${row.code1 || '-'}</td>
      <td>${code2Display(row.code2)}</td>
      <td>${row.qtyDisplay != null ? row.qtyDisplay : formatQty(row.qty)} كيلو</td>
      <td><input type="text" class="notes-edit" data-idx="${idx}" value="${(row.notes || '').replace(/"/g, '&quot;')}" placeholder="ملاحظات"></td>
      <td><button class="remove-btn" data-idx="${idx}">حذف</button></td>
    `;
    cartBody.appendChild(tr);
  });
  cartCount.textContent = cart.length;
  cartWrap.classList.toggle('active', cart.length > 0);

  cartBody.querySelectorAll('.remove-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.idx, 10);
      cart.splice(i, 1);
      renderCart();
    });
  });

  cartBody.querySelectorAll('.notes-edit').forEach(inp => {
    inp.addEventListener('input', () => {
      const i = parseInt(inp.dataset.idx, 10);
      cart[i].notes = inp.value;
    });
  });
}

addBtn.addEventListener('click', () => {
  if (!selectedItem) return;
  const rawQty = qtyInput.value.trim();
  const qty = parseFloat(rawQty);
  if (!qty || qty <= 0) {
    qtyInput.focus();
    qtyInput.style.borderColor = '#ff5555';
    setTimeout(() => { qtyInput.style.borderColor = ''; }, 900);
    return;
  }

  const noteText = notesInput.value.trim();

  // لو الصنف موجود بالفعل في الجدول، يتم جمع الكمية بدلاً من إضافة صف جديد
  // (وفي الحالة دي بيتم عرض الكمية بعد تنسيقها لأن الكمية بقت ناتج جمع أكتر من قيمة)
  const existing = cart.find(row => row.m === selectedItem.m);
  if (existing) {
    existing.qty += qty;
    existing.qtyDisplay = formatQty(existing.qty);
    if (noteText) {
      existing.notes = existing.notes ? (existing.notes + ' / ' + noteText) : noteText;
    }
  } else {
    // بيتم عرض الكمية بالظبط زي ما المستخدم كاتبها من غير أي تغيير
    cart.push({ ...selectedItem, qty, qtyDisplay: rawQty, notes: noteText });
  }
  renderCart();

  // إعادة الضبط بعد الإضافة: تفريغ خانة البحث كمان عشان تبدأ تدور على صنف جديد من الأول
  qtyPanel.classList.remove('active');
  selectedItem = null;
  qtyInput.value = '';
  notesInput.value = '';
  searchInput.value = '';
  render('');
  searchInput.focus();
});

searchInput.addEventListener('input', (e) => render(e.target.value));
render();

/* ================================================================
   تصدير الأوردر كملف إكسيل (xlsx) بتنسيق شبيه بالنموذج المطلوب:
   صف "التاريخ"، صف "السادة" (وفيه اسم الملف اللي المستخدم كاتبه)،
   جدول بأعمدة: م / الصنف / الكود / الكمية، وصف إجمالي في الآخر.
   ================================================================ */
const downloadPdfBtn = document.getElementById('downloadPdfBtn');
const fileNameInput = document.getElementById('fileNameInput');

// بيشيل من اسم الملف أي حروف ممكن تسبب مشكلة في نظام الملفات
function sanitizeFileName(name) {
  return name.replace(/[\\/:*?"<>|]/g, '').trim();
}

function borderAll(color) {
  const side = { style: 'thin', color: { rgb: color } };
  return { top: side, bottom: side, left: side, right: side };
}

downloadPdfBtn.addEventListener('click', () => {
  if (cart.length === 0) return;

  downloadPdfBtn.disabled = true;
  const originalText = downloadPdfBtn.textContent;
  downloadPdfBtn.textContent = '⏳ جاري التجهيز...';

  try {
    const now = new Date();
    const fileDate = now.toISOString().slice(0, 10);
    const customName = sanitizeFileName(fileNameInput.value || '');
    const clientName = customName || 'بدون اسم';

    const n = cart.length;
    const totalQty = cart.reduce((sum, r) => sum + r.qty, 0);

    // ترتيب الأعمدة من اليمين لليسار: م / الصنف / كودTCF / كود كريشين-اكسبريشن / الكمية / ملاحظات
    const COL_COUNT = 6;
    const aoa = [
      ['التاريخ : ' + now.toLocaleDateString('ar-EG'), '', '', '', '', ''],
      ['السادة : ' + clientName, '', '', '', '', ''],
      ['م', 'الصنف', 'كودTCF', 'كود كريشين/اكسبريشن', 'الكمية', 'ملاحظات'],
      ...cart.map((row, idx) => ([
        idx + 1,
        row.name,
        row.code1 || '-',
        row.code2 ? (row.code2 + ' (' + code2Label(row.code2) + ')') : '-',
        row.qtyDisplay != null ? row.qtyDisplay : formatQty(row.qty),
        row.notes || '',
      ])),
      ['الإجمالي', '', '', '', formatQty(totalQty), ''],
    ];

    const ws = XLSX.utils.aoa_to_sheet(aoa);

    // عرض الأعمدة
    ws['!cols'] = [
      { wch: 6 },   // م
      { wch: 26 },  // الصنف
      { wch: 16 },  // كودTCF
      { wch: 26 },  // كود كريشين/اكسبريشن
      { wch: 12 },  // الكمية
      { wch: 26 },  // ملاحظات
    ];

    // ارتفاع الصفوف عشان الخط الأكبر ياخد مساحته
    ws['!rows'] = aoa.map(() => ({ hpx: 24 }));

    const HEADER_ROW = 2;       // صف عناوين الأعمدة
    const DATA_START = 3;       // أول صف بيانات
    const DATA_END = 3 + n - 1; // آخر صف بيانات
    const TOTAL_ROW = 3 + n;    // صف الإجمالي

    ws['!merges'] = [
      { s: { r: 0, c: 0 }, e: { r: 0, c: COL_COUNT - 1 } }, // صف التاريخ
      { s: { r: 1, c: 0 }, e: { r: 1, c: COL_COUNT - 1 } }, // صف السادة
      { s: { r: TOTAL_ROW, c: 0 }, e: { r: TOTAL_ROW, c: 3 } }, // الإجمالي (قبل عمود الكمية)
    ];

    const goldFill = { patternType: 'solid', fgColor: { rgb: 'F7DFA0' } };
    const peachFill = { patternType: 'solid', fgColor: { rgb: 'F8CBAD' } };
    const whiteFill = { patternType: 'solid', fgColor: { rgb: 'FFFFFF' } };
    const border = borderAll('B8860B');
    const centerAlign = { horizontal: 'center', vertical: 'center' };
    const rightAlign = { horizontal: 'right', vertical: 'center' };
    // نفس المحاذاة لكن بتجبر اتجاه الكتابة يكون من اليمين لليسار (مفيد لعمود الملاحظات
    // اللي أحياناً بيبدأ برقم فبيخلي إكسيل يعرضه Left-to-Right رغم إن الشيت RTL)
    const centerAlignRTL = { horizontal: 'center', vertical: 'center', readingOrder: 2 };

    function setStyle(r, c, style) {
      const ref = XLSX.utils.encode_cell({ r, c });
      if (!ws[ref]) ws[ref] = { t: 's', v: '' };
      ws[ref].s = style;
    }

    // صف التاريخ وصف السادة (خط أكبر)
    setStyle(0, 0, { font: { bold: true, sz: 14 }, alignment: rightAlign });
    setStyle(1, 0, { font: { bold: true, sz: 14, color: { rgb: 'B8860B' } }, alignment: rightAlign });

    // صف عناوين الأعمدة
    for (let c = 0; c < COL_COUNT; c++) {
      setStyle(HEADER_ROW, c, {
        font: { bold: true, sz: 13, color: { rgb: '3D2B00' } },
        fill: goldFill,
        border,
        alignment: c === COL_COUNT - 1 ? centerAlignRTL : centerAlign,
      });
    }

    // صفوف البيانات
    for (let r = DATA_START; r <= DATA_END; r++) {
      // عمود م بلون خوخي
      setStyle(r, 0, { font: { bold: true, sz: 12 }, fill: peachFill, border, alignment: centerAlign });
      // باقي الأعمدة
      const NOTES_COL = COL_COUNT - 1; // عمود الملاحظات (آخر عمود)
      for (let c = 1; c < COL_COUNT; c++) {
        setStyle(r, c, {
          font: { sz: 12 },
          fill: whiteFill,
          border,
          alignment: c === NOTES_COL ? centerAlignRTL : centerAlign,
        });
      }
    }

    // صف الإجمالي
    const QTY_COL = 4; // عمود الكمية
    setStyle(TOTAL_ROW, 0, { font: { bold: true, sz: 13 }, fill: goldFill, border, alignment: centerAlign });
    setStyle(TOTAL_ROW, QTY_COL, { font: { bold: true, sz: 13 }, fill: goldFill, border, alignment: centerAlign });
    setStyle(TOTAL_ROW, QTY_COL + 1, { font: { sz: 12 }, fill: goldFill, border, alignment: centerAlign });

    // فلتر أعلى الجدول زي الصورة
    ws['!autofilter'] = { ref: `A${HEADER_ROW + 1}:${XLSX.utils.encode_col(COL_COUNT - 1)}${HEADER_ROW + 1}` };

    // اتجاه الورقة من اليمين لليسار (على مستوى الشيت + الملف كله)
    ws['!views'] = [{ rightToLeft: true }];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'الأوردر');
    wb.Workbook = wb.Workbook || {};
    wb.Workbook.Views = [{ RTL: true }];

    const baseName = customName ? customName : 'اوردر-الماسة-الذهبية';
    XLSX.writeFile(wb, `${baseName}-${fileDate}.xlsx`);
  } catch (err) {
    alert('حدث خطأ أثناء إنشاء ملف الإكسيل، برجاء المحاولة مرة أخرى.');
    console.error(err);
  } finally {
    downloadPdfBtn.disabled = false;
    downloadPdfBtn.textContent = originalText;
  }
});

  s.style.left = left + 'vw';
  s.style.width = size + 'px';
  s.style.height = size + 'px';
  s.style.animationDuration = duration + 's';
  s.style.animationDelay = delay + 's';
  sparkleLayer.appendChild(s);
}
